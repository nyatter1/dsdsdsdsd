<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rovixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229" />
      <stop offset="100%" stop-color="#0f1114" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d8e0" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="120" height="120" rx="28" fill="url(#rovixBg)" stroke="#303540" stroke-width="3" />
  
  <!-- Stylized Iconic Rovix tilted square emblem -->
  <g transform="translate(60, 42) rotate(14) scale(0.62)">
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="url(#rGrad)" />
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#141619" />
  </g>
  
  <!-- Crisp 'Rovix' wordmark centered underneath -->
  <text x="60" y="96" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="1" 
        fill="#ffffff" 
        text-anchor="middle">ROVIX</text>
</svg>
